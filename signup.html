<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - LearnMate AI</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <div class="brand-logo" style="width: 44px; height: 44px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
        </a>
        <h2 style="font-size: 1.65rem; color: var(--text-primary); margin-bottom: 0.35rem;">Create Your Account</h2>
        <p style="font-size: 0.875rem; color: var(--text-secondary);">Start generating personalized multi-format study content today.</p>
      </div>

      <form id="signup-form">
        <!-- 1. Full Name -->
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <div class="input-icon-group">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="signup-name" class="form-input" placeholder="e.g. Jordan Lee" required>
          </div>
        </div>

        <!-- 2. Email Address -->
        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <div class="input-icon-group">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input type="email" id="signup-email" class="form-input" placeholder="student@example.com" required>
          </div>
        </div>

        <!-- 3. Password -->
        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <div class="input-icon-group">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="signup-password" class="form-input" placeholder="Create a strong password" required>
          </div>
          <div class="password-strength-bar">
            <div id="password-strength-fill" class="password-strength-fill"></div>
          </div>
          <span class="form-hint">Must be at least 8 characters with letters & numbers.</span>
        </div>

        <!-- 4. Confirm Password -->
        <div class="form-group mb-6">
          <label class="form-label" for="signup-confirm-password">Confirm Password</label>
          <div class="input-icon-group">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <input type="password" id="signup-confirm-password" class="form-input" placeholder="Re-enter your password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full" style="width: 100%; padding: 0.85rem;">
          Create Account & Set Preferences
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary);">
        Already have an account? <a href="login.html" style="font-weight: 600; color: var(--primary);">Log In</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      LearnMateAuth.initSignup();
    });
  </script>
</body>
</html>

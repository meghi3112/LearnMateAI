<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - LearnMate AI</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <div class="brand-logo" style="width: 44px; height: 44px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
        </a>
        <h2 style="font-size: 1.65rem; color: var(--text-primary); margin-bottom: 0.35rem;">Welcome Back</h2>
        <p style="font-size: 0.875rem; color: var(--text-secondary);">Log in to continue your personalized learning journey.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="input-icon-group">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input type="email" id="login-email" class="form-input" placeholder="student@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <div class="flex justify-between items-center">
            <label class="form-label" for="login-password">Password</label>
            <a href="#" style="font-size: 0.8rem; color: var(--primary);">Forgot password?</a>
          </div>
          <div class="input-icon-group">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
          </div>
        </div>

        <div class="flex items-center justify-between mb-6">
          <label class="checkbox-label">
            <input type="checkbox" class="form-checkbox" checked>
            <span>Remember this device</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-full" style="width: 100%; padding: 0.85rem;">
          Log In
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary);">
        Don't have an account? <a href="signup.html" style="font-weight: 600; color: var(--primary);">Create Account</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      LearnMateAuth.initLogin();
    });
  </script>
</body>
</html>

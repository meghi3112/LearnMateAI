<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning History - LearnMate AI</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Open Sidebar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h1 class="page-title">Learning History</h1>
            <span style="font-size: 0.75rem; color: var(--text-muted);">Revisit previous topics, generated resources, and quiz performance</span>
          </div>
        </div>

        <div class="header-right">
          <a href="app.html" class="btn btn-primary btn-sm">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            New Learning Session
          </a>
        </div>
      </header>

      <div class="page-body">
        
        <!-- Search & Filter Controls -->
        <div class="materials-toolbar">
          <div class="input-icon-group" style="flex: 1; max-width: 440px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-history-input" class="form-input" placeholder="Search sessions by topic name...">
          </div>

          <div class="flex items-center gap-3">
            <select id="filter-history-score" class="form-select" style="width: auto;">
              <option value="all">All Quiz Scores</option>
              <option value="high">High Mastery (≥ 80%)</option>
              <option value="review">Needs Review (&lt; 70%)</option>
            </select>
          </div>
        </div>

        <!-- History Sessions List -->
        <div id="history-list-container"></div>

      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/history.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      LearnMateComponents.initSidebar("history");
      LearnMateHistory.init();
    });
  </script>
</body>
</html>

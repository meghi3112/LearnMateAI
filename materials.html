<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Materials - LearnMate AI</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Open Sidebar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h1 class="page-title">My Study Materials</h1>
            <span style="font-size: 0.75rem; color: var(--text-muted);">Manage uploaded lecture slides, notes, and textbook excerpts</span>
          </div>
        </div>

        <div class="header-right">
          <button class="btn btn-primary btn-sm" id="btn-open-upload-modal">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload New Material
          </button>
        </div>
      </header>

      <div class="page-body">
        
        <!-- Search & Filter Toolbar -->
        <div class="materials-toolbar">
          <div class="input-icon-group" style="flex: 1; max-width: 440px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-materials-input" class="form-input" placeholder="Search by file name or topic...">
          </div>

          <div class="flex items-center gap-3">
            <select id="filter-materials-type" class="form-select" style="width: auto;">
              <option value="all">All File Types</option>
              <option value="pdf">PDF Documents</option>
              <option value="docx">Word (.docx)</option>
              <option value="pptx">PowerPoint (.pptx)</option>
            </select>
          </div>
        </div>

        <!-- Materials List Container -->
        <div id="materials-list-container"></div>

      </div>
    </main>
  </div>

  <!-- Upload Material Modal -->
  <div class="modal-overlay" id="upload-material-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 style="font-size: 1.2rem;">Upload Study Material</h3>
        <button class="modal-close" id="btn-close-upload-modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="dropzone-container mb-4" onclick="document.getElementById('modal-file-picker').click()">
          <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <div style="font-weight: 700; color: var(--text-primary); margin-bottom: 0.25rem;">Select or drop PDF / DOCX / PPT file</div>
          <div style="font-size: 0.8rem; color: var(--text-muted);">Maximum file size: 25MB</div>
          <input type="file" id="modal-file-picker" style="display: none;" accept=".pdf,.docx,.ppt,.pptx">
        </div>

        <div class="form-group">
          <label class="form-label" for="modal-material-title">Document Title / Topic Name</label>
          <input type="text" id="modal-material-title" class="form-input" placeholder="e.g. Operating Systems Chapter 4 - Memory Management.pdf">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline btn-sm" id="btn-cancel-upload">Cancel</button>
        <button class="btn btn-primary btn-sm" id="btn-submit-upload">Upload Material</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/materials.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      LearnMateComponents.initSidebar("materials");
      LearnMateMaterials.init();
    });
  </script>
</body>
</html>
